<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-GOV // MISSION CONTROL</title>
<style>
:root{
  --bg:#0a0e14; --panel:#0d141d; --panel2:#0b1017; --line:#1b2836;
  --green:#39ff9c; --cyan:#3ce4ff; --amber:#ffb84d; --red:#ff5f6b;
  --dim:#4d6070; --txt:#b8ccd9; --bright:#e8f4fb;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt); font-family:var(--mono); font-size:13px;
  display:flex; flex-direction:column; overflow:hidden;
  background-image:
    linear-gradient(rgba(60,228,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(60,228,255,.035) 1px,transparent 1px);
  background-size:28px 28px;
}
header{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 18px; border-bottom:1px solid var(--line); background:rgba(13,20,29,.85);
}
#brand{color:var(--green); font-weight:700; letter-spacing:.08em}
#brand span{color:var(--dim); font-weight:400; margin-left:8px}
#runinfo{color:var(--dim)} #runinfo b{color:var(--bright); font-weight:600}
#lampbox{display:flex; align-items:center; gap:8px}
#lamp{width:11px;height:11px;border-radius:50%;background:var(--dim);box-shadow:0 0 6px transparent}
#lamp.idle{background:#37424d}
#lamp.running{background:var(--green);box-shadow:0 0 10px var(--green);animation:blink 1.1s infinite}
#lamp.confirmed{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
#lamp.escalated{background:var(--amber);box-shadow:0 0 10px var(--amber);animation:blink 1.8s infinite}
#lamp.stale{background:var(--amber);opacity:.5}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
#status-text{letter-spacing:.15em;color:var(--bright)}

#gauges{display:flex; gap:14px; padding:12px 18px 4px}
.gauge{
  flex:1; background:var(--panel); border:1px solid var(--line); border-radius:6px;
  padding:8px 10px 26px; text-align:center; position:relative;
}
.gauge .glabel{color:var(--dim); font-size:11px; letter-spacing:.12em}
.gauge .gval{position:absolute; left:0; right:0; bottom:4px; font-size:16px; color:var(--bright)}
.gauge svg{width:100%; max-height:96px}
.needle{transition:transform .9s cubic-bezier(.25,1.2,.4,1); transform-origin:100px 88px}

main{flex:1; display:flex; min-height:0; padding:10px 18px; gap:14px}
#graph-wrap{
  flex:1; position:relative; background:var(--panel); border:1px solid var(--line);
  border-radius:6px; min-width:0;
}
#graph-wrap h2, #detail h2, #console-head{
  font-size:11px; color:var(--dim); letter-spacing:.14em; font-weight:400;
  padding:8px 12px; border-bottom:1px solid var(--line);
}
#net{width:100%; height:calc(100% - 32px); display:block}
#empty-overlay[hidden]{display:none}
#empty-overlay{
  position:absolute; inset:32px 0 0 0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px; background:rgba(10,14,20,.72);
  color:var(--dim); letter-spacing:.1em; text-align:center;
}
#empty-overlay .big{color:var(--txt); font-size:15px}
#detail{
  width:340px; background:var(--panel); border:1px solid var(--line); border-radius:6px;
  display:flex; flex-direction:column; min-height:0;
}
#d-body{padding:10px 12px; overflow-y:auto; flex:1; line-height:1.55}
#d-body .k{color:var(--dim)} #d-body .v{color:var(--bright)}
#d-body .ev{border-left:2px solid var(--line); margin:8px 0; padding:2px 8px}
#d-body .ev .q{color:var(--txt)}
#d-body .ev .src{color:var(--cyan); font-size:11px}
#d-body .badge{font-size:10px; border:1px solid var(--dim); border-radius:3px; padding:0 4px; color:var(--dim); margin-left:6px}
#d-body .badge.direct{color:var(--green); border-color:var(--green)}
#d-body .hyp{color:var(--amber); margin:4px 0 4px 8px}

footer#console{
  height:172px; margin:0 18px 14px; background:var(--panel2);
  border:1px solid var(--line); border-radius:6px; display:flex; flex-direction:column;
}
#console-body{flex:1; overflow-y:auto; padding:6px 12px; line-height:1.6; font-size:12px}
#console-body .t{color:var(--dim)}
#console-body .ok{color:var(--green)} #console-body .info{color:var(--cyan)}
#console-body .warn{color:var(--amber)} #console-body .err{color:var(--red)}

/* SVG graph */
.node circle.core{fill:#0e1822; stroke:var(--dim); stroke-width:1.5}
.node text{fill:var(--dim); font-family:var(--mono); font-size:11px; text-anchor:middle; letter-spacing:.08em}
.node .sub{font-size:10px; fill:#33424f}
.node.done circle.core{stroke:var(--green); filter:drop-shadow(0 0 6px rgba(57,255,156,.55))}
.node.done text.name{fill:var(--bright)}
.node.done .sub{fill:var(--green)}
.node.done-amber circle.core{stroke:var(--amber); filter:drop-shadow(0 0 7px rgba(255,184,77,.6))}
.node.done-amber text.name{fill:var(--bright)} .node.done-amber .sub{fill:var(--amber)}
.node.done-cyan circle.core{stroke:var(--cyan); filter:drop-shadow(0 0 7px rgba(60,228,255,.6))}
.node.done-cyan text.name{fill:var(--bright)} .node.done-cyan .sub{fill:var(--cyan)}
.node.running circle.core{stroke:var(--cyan)}
.node.running text.name{fill:var(--bright)} .node.running .sub{fill:var(--cyan)}
.node .halo{fill:none; stroke:var(--cyan); opacity:0; pointer-events:none}
.node.running .halo{opacity:1}
.node{cursor:pointer}
.edge{stroke:#22303e; stroke-width:1.5; fill:none}
.edge.lit{stroke:#2a5a4a}
.edge.active{stroke:var(--cyan); filter:drop-shadow(0 0 3px rgba(60,228,255,.5))}
.edge.esc{stroke-dasharray:5 5}
.edge.esc.active{stroke:var(--amber); filter:drop-shadow(0 0 3px rgba(255,184,77,.5))}
.pulse{fill:var(--cyan); display:none}
.pulse.on{display:block}
.pulse.amber{fill:var(--amber)}
</style>
</head>
<body>
<header>
  <div id="brand">◉ AI-GOV <span>// MISSION CONTROL</span></div>
  <div id="runinfo">RUN <b id="run-id">—</b> &nbsp;·&nbsp; T+<b id="elapsed">--:--</b></div>
  <div id="lampbox"><span id="lamp" class="idle"></span><span id="status-text">IDLE</span></div>
</header>

<section id="gauges">
  <div class="gauge" id="g-auto"><div class="glabel">AUTO-CONFIRM RATE</div></div>
  <div class="gauge" id="g-esc"><div class="glabel">ESCALATION RATE</div></div>
  <div class="gauge" id="g-cit"><div class="glabel">CITATION PASS RATE</div></div>
</section>

<main>
  <section id="graph-wrap">
    <h2>ENSEMBLE PIPELINE — NEURAL VIEW</h2>
    <svg id="net" viewBox="0 0 1000 430" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="empty-overlay" hidden>
      <div class="big">대기 중 — 파이프라인을 실행하면 표시됩니다</div>
      <div>ensemble-orchestration 스킬로 실행하거나<br>golden/run_regression.py를 돌리면 여기에 실시간 반영됩니다</div>
    </div>
  </section>
  <aside id="detail">
    <h2 id="d-title">NODE DETAIL</h2>
    <div id="d-body">노드를 클릭하면 판정 상세가 표시됩니다.</div>
  </aside>
</main>

<footer id="console">
  <div id="console-head">▤ EVENT LOG</div>
  <div id="console-body"></div>
</footer>

<script>
"use strict";
const $ = s => document.querySelector(s);
const SVGNS = "http://www.w3.org/2000/svg";
const GA = {green:"#39ff9c", cyan:"#3ce4ff", amber:"#ffb84d"};

/* ---------- 게이지 ---------- */
function makeGauge(el, color){
  const svg = document.createElementNS(SVGNS,"svg");
  svg.setAttribute("viewBox","0 0 200 100");
  let ticks = "";
  for(let a=0;a<=180;a+=15){
    const r1=78,r2=(a%45===0)?68:73, rad=Math.PI*(180-a)/180;
    const x1=100+r1*Math.cos(rad), y1=88-r1*Math.sin(rad);
    const x2=100+r2*Math.cos(rad), y2=88-r2*Math.sin(rad);
    ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2a3947" stroke-width="1.5"/>`;
  }
  svg.innerHTML = `
    <path d="M 22 88 A 78 78 0 0 1 178 88" fill="none" stroke="#1b2836" stroke-width="7"/>
    <path class="arcval" d="M 22 88 A 78 78 0 0 1 178 88" fill="none" stroke="${color}"
          stroke-width="7" stroke-linecap="round" stroke-dasharray="245" stroke-dashoffset="245"
          style="transition:stroke-dashoffset .9s cubic-bezier(.25,1.2,.4,1); opacity:.45"/>
    ${ticks}
    <g class="needle"><line x1="100" y1="88" x2="100" y2="22" stroke="${color}" stroke-width="2.5"/>
      <circle cx="100" cy="88" r="5" fill="#0e1822" stroke="${color}" stroke-width="2"/></g>`;
  el.appendChild(svg);
  const val = document.createElement("div");
  val.className="gval"; val.textContent="—"; el.appendChild(val);
  let first = true;
  return pct => {
    const has = pct !== null && pct !== undefined;
    const deg = has ? (pct/100*180 - 90) : -90;
    const needle = svg.querySelector(".needle");
    if(first){ needle.style.transition="none"; requestAnimationFrame(()=>needle.style.transition=""); first=false; }
    needle.style.transform = `rotate(${deg}deg)`;
    svg.querySelector(".arcval").style.strokeDashoffset = has ? 245*(1-pct/100) : 245;
    val.textContent = has ? pct.toFixed(1)+"%" : "—";
  };
}
const gauges = {
  auto: makeGauge($("#g-auto"), GA.green),
  esc:  makeGauge($("#g-esc"),  GA.amber),
  cit:  makeGauge($("#g-cit"),  GA.cyan),
};

/* ---------- 신경망 그래프 ---------- */
const NODES = {
  input:       {x:80,  y:215, label:"INPUT",       fixed:"done-cyan"},
  analyst:     {x:270, y:120, label:"ANALYST"},
  independent: {x:270, y:310, label:"INDEPENDENT"},
  critic:      {x:465, y:215, label:"CRITIC"},
  verifier:    {x:635, y:215, label:"VERIFIER"},
  synthesizer: {x:790, y:215, label:"SYNTH"},
  confirmed:   {x:930, y:120, label:"CONFIRMED",   terminal:"done-cyan"},
  escalated:   {x:930, y:310, label:"ESCALATED",   terminal:"done-amber"},
};
const EDGES = [
  ["input","analyst"], ["input","independent"],
  ["analyst","critic"], ["independent","critic"],
  ["critic","verifier"], ["verifier","synthesizer"],
  ["synthesizer","confirmed"], ["synthesizer","escalated",true],
];
const net = $("#net");
function edgePath(a,b){
  const dx=(b.x-a.x)*0.45;
  return `M ${a.x+34} ${a.y} C ${a.x+34+dx} ${a.y}, ${b.x-34-dx} ${b.y}, ${b.x-34} ${b.y}`;
}
const edgeEls={}, nodeEls={}, pulseEls={};
EDGES.forEach(([a,b,esc],i)=>{
  const p=document.createElementNS(SVGNS,"path");
  p.setAttribute("d", edgePath(NODES[a],NODES[b]));
  p.setAttribute("id", "e"+i);
  p.setAttribute("class", "edge"+(esc?" esc":""));
  net.appendChild(p);
  edgeEls[a+">"+b]=p;
  const dots=[];
  [0,-0.7].forEach(off=>{
    const c=document.createElementNS(SVGNS,"circle");
    c.setAttribute("r","3.2");
    c.setAttribute("class","pulse"+(esc?" amber":""));
    const am=document.createElementNS(SVGNS,"animateMotion");
    am.setAttribute("dur","1.4s"); am.setAttribute("repeatCount","indefinite");
    am.setAttribute("begin", off+"s");
    const mp=document.createElementNS(SVGNS,"mpath");
    mp.setAttributeNS("http://www.w3.org/1999/xlink","href","#e"+i);
    am.appendChild(mp); c.appendChild(am); net.appendChild(c); dots.push(c);
  });
  pulseEls[a+">"+b]=dots;
});
Object.entries(NODES).forEach(([id,n])=>{
  const g=document.createElementNS(SVGNS,"g");
  g.setAttribute("class","node"); g.dataset.id=id;
  g.innerHTML =
    `<circle class="halo" cx="${n.x}" cy="${n.y}" r="34">
       <animate attributeName="r" values="34;44;34" dur="1.5s" repeatCount="indefinite"/>
       <animate attributeName="stroke-opacity" values=".8;0;.8" dur="1.5s" repeatCount="indefinite"/>
     </circle>
     <circle class="core" cx="${n.x}" cy="${n.y}" r="32"/>
     <text class="name" x="${n.x}" y="${n.y-2}">${n.label}</text>
     <text class="sub"  x="${n.x}" y="${n.y+13}">—</text>`;
  g.addEventListener("click",()=>showDetail(id));
  net.appendChild(g);
  nodeEls[id]=g;
});

/* ---------- 상태 반영 ---------- */
let STATE=null, selected=null, startedAt=null, endedAt=null;
const seenLog=new Set();

function setNode(id, cls, sub){
  const g=nodeEls[id];
  g.setAttribute("class","node "+cls);
  g.querySelector(".sub").textContent = sub||"—";
}
function fmtClock(ts){
  const d=new Date(ts*1000);
  return d.toTimeString().slice(0,8);
}
function render(st){
  STATE=st;
  const run=st.run, roles=run.roles;

  // 헤더
  $("#run-id").textContent = run.run_id || (run.status==="running"?"LIVE":"—");
  $("#lamp").className = run.status;
  $("#status-text").textContent = run.status.toUpperCase();
  startedAt=run.started_at; endedAt=run.ended_at;

  // 게이지
  gauges.auto(st.stats.auto_confirm_rate);
  gauges.esc(st.stats.escalation_rate);
  gauges.cit(st.stats.citations_pass_rate);

  // 노드
  setNode("input","done-cyan", st.manifests_recent[0]?.input_files?.length
    ? st.manifests_recent[0].input_files.length+" file" : "src");
  for(const r of ["analyst","independent","critic","verifier","synthesizer"]){
    const d=roles[r];
    if(d.state==="done"){
      setNode(r, d.escalate?"done-amber":"done",
        (d.verdict||"").slice(0,14)||"done");
    }else if(d.state==="running"){
      setNode(r,"running", d.inferred?"running?":"running");
    }else setNode(r,"pending","—");
  }
  const synthDone = roles.synthesizer.state==="done";
  const escal = synthDone && roles.synthesizer.escalate;
  setNode("confirmed", synthDone && !escal ? "done-cyan" : "pending", synthDone&&!escal?"routed":"—");
  setNode("escalated", escal ? "done-amber" : "pending", escal?"routed":"—");

  // 엣지: src 완료 & dst 실행중 → active(펄스), 둘 다 완료 → lit
  EDGES.forEach(([a,b,esc])=>{
    const key=a+">"+b, el=edgeEls[key];
    const sa = a==="input" ? "done" : roles[a]?.state;
    let sb;
    if(b==="confirmed") sb = synthDone && !escal ? "done" : "pending";
    else if(b==="escalated") sb = escal ? "done" : "pending";
    else sb = roles[b]?.state;
    let cls="edge"+(esc?" esc":"");
    let pulse=false;
    if(sa==="done" && sb==="running"){ cls+=" active"; pulse=true; }
    else if(sa==="done" && sb==="done"){
      cls+=" active";
      // 종단 엣지는 결과가 살아있는 동안 펄스를 계속 흘린다
      pulse = (b==="confirmed"||b==="escalated");
      if(!pulse) cls=cls.replace(" active"," lit");
    }
    el.setAttribute("class",cls);
    pulseEls[key].forEach(c=>c.setAttribute("class",
      "pulse"+(esc?" amber":"")+(pulse?" on":"")));
  });

  // 빈 상태 오버레이
  $("#empty-overlay").hidden = !st.empty;

  // 콘솔
  const body=$("#console-body");
  const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 30;
  st.events.forEach(ev=>{
    const key=ev.ts+"|"+ev.text;
    if(seenLog.has(key)) return;
    seenLog.add(key);
    const line=document.createElement("div");
    line.innerHTML=`<span class="t">[${fmtClock(ev.ts)}]</span> <span class="${ev.level}">▸</span> ${escapeHtml(ev.text)}`;
    body.appendChild(line);
  });
  while(body.childElementCount>250) body.removeChild(body.firstChild);
  if(atBottom) body.scrollTop=body.scrollHeight;

  if(selected) showDetail(selected,true);
}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ---------- 상세 패널 ---------- */
function showDetail(id, silent){
  selected=id;
  if(!STATE) return;
  const roles=STATE.run.roles;
  const t=$("#d-title"), b=$("#d-body");
  if(id==="input"){
    t.textContent="INPUT";
    const m=STATE.manifests_recent[0];
    b.innerHTML = m&&m.input_files&&m.input_files.length
      ? `<div class="k">최근 실행의 입력 파일:</div>`+m.input_files.map(f=>`<div class="ev"><span class="src">${escapeHtml(f)}</span></div>`).join("")
      : "입력 정보 없음 (매니페스트 기록 후 표시)";
    return;
  }
  if(id==="confirmed"||id==="escalated"){
    t.textContent=id.toUpperCase();
    const s=roles.synthesizer;
    if(s.state!=="done"){ b.innerHTML="synthesizer 미완료 — 라우팅 전"; return; }
    let h=`<div><span class="k">routing:</span> <span class="v">${s.escalate?"escalated":"auto_confirmed"}</span></div>`;
    if(s.escalate&&s.escalation_reason)
      h+=`<div class="ev"><div class="q">${escapeHtml(s.escalation_reason)}</div></div>`;
    h+=`<div style="margin-top:8px"><span class="k">에스컬레이션 대기 큐:</span> <span class="v">${STATE.escalations.count}건</span></div>`;
    STATE.escalations.docs.slice(0,6).forEach(d=>h+=`<div class="ev"><span class="src">${escapeHtml(d.name)}</span></div>`);
    b.innerHTML=h;
    return;
  }
  const d=roles[id];
  t.textContent=id.toUpperCase();
  if(!d||d.state==="pending"){ b.innerHTML="산출물 없음 (대기 중)"; return; }
  if(d.state==="running"){ b.innerHTML=`실행 중…${d.inferred?"<br><span class='k'>(judgment 파일 감지 기반 추정)</span>":""}`; return; }
  let h=`<div><span class="k">verdict:</span> <span class="v">${escapeHtml(d.verdict||"")}</span></div>
         <div><span class="k">confidence:</span> <span class="v">${escapeHtml(d.confidence||"")}</span></div>
         <div><span class="k">escalate:</span> <span class="v">${d.escalate}</span></div>`;
  if(d.escalation_reason) h+=`<div class="ev"><div class="q">${escapeHtml(String(d.escalation_reason).slice(0,400))}</div></div>`;
  if(d.alternative_hypotheses&&d.alternative_hypotheses.length){
    h+=`<div style="margin-top:8px" class="k">대안 가설 ${d.alternative_hypotheses.length}건:</div>`;
    d.alternative_hypotheses.slice(0,8).forEach(x=>h+=`<div class="hyp">◈ ${escapeHtml(String(x).slice(0,180))}</div>`);
  }
  h+=`<div style="margin-top:8px" class="k">근거 인용 ${d.evidence.length}건:</div>`;
  d.evidence.slice(0,30).forEach(e=>{
    h+=`<div class="ev"><div class="q">“${escapeHtml(String(e.quote||"").slice(0,220))}”</div>
        <span class="src">${escapeHtml(e.source_location||"")}</span>
        <span class="badge ${e.directness==="direct"?"direct":""}">${escapeHtml(e.directness||"")}</span></div>`;
  });
  b.innerHTML=h;
  if(!silent) $("#d-body").scrollTop=0;
}

/* ---------- 경과 시간 ---------- */
setInterval(()=>{
  if(!startedAt){ $("#elapsed").textContent="--:--"; return; }
  const end = endedAt || Date.now()/1000;
  let s=Math.max(0,Math.floor(end-startedAt));
  const h=Math.floor(s/3600); s%=3600;
  const m=String(Math.floor(s/60)).padStart(2,"0"), sec=String(s%60).padStart(2,"0");
  $("#elapsed").textContent = (h?h+":":"")+m+":"+sec;
},500);

/* ---------- 폴링 ---------- */
async function poll(){
  try{
    const r=await fetch("/api/state",{cache:"no-store"});
    if(r.ok) render(await r.json());
  }catch(e){ $("#status-text").textContent="LINK LOST"; $("#lamp").className="stale"; }
}
poll();
setInterval(poll,2000);
</script>
</body>
</html>
